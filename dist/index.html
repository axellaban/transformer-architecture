<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b131e">
  <meta name="description" content="Explora el Transformer original y DeepSeek V4.1 Flash en 3D, o mira la historia narrada de un minuto con lo que cambió.">
  <title>Transformer original vs DeepSeek</title>
  <link rel="stylesheet" href="style.css?revision=11">
  <script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
</head>
<body>
  <header class="app-header">
    <h1>Transformer original <span>vs</span> DeepSeek</h1>
    <div class="header-actions">
      <button id="home" class="quiet-button" aria-label="Ver toda la arquitectura" title="Vista general">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5M8 8h8v8H8z"/></svg><span>Vista general</span>
      </button>
      <button id="sources" class="icon-button quiet-button" aria-label="Fuentes" title="Fuentes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4zM12 5v15"/></svg></button>
      <button id="story-toggle" class="story-button" aria-label="Ver la historia de un minuto" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg><span id="story-toggle-label">Modo historia</span><span id="story-duration">1 min</span>
      </button>
    </div>
  </header>
  <main>
    <nav class="models" aria-label="Arquitectura">
      <button data-era="0" class="active" aria-label="Transformer original"><span class="year">2017</span><strong>Transformer original</strong><span class="count">6 codificador + 6 decodificador</span></button>
      <button data-era="1" aria-label="DeepSeek V4.1 Flash"><span class="year">2026</span><strong>DeepSeek V4.1 Flash</strong><span class="count">20 codificador + 20 decodificador</span></button>
    </nav>
    <section id="scene-wrap" aria-label="Comparación espacial de las arquitecturas">
      <canvas id="scene" aria-label="Arquitectura 3D interactiva"></canvas>
      <div id="labels"></div>
      <div id="loading">Abriendo las arquitecturas…</div>
      <button id="selection" class="selection" hidden title="Volver a la vista general"><span id="selection-name"></span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
    </section>
    <footer id="explore-controls" class="explore-controls">
      <button id="play" class="icon-button" aria-label="Pausar el flujo de tokens" title="Pausa"></button>
      <label class="context"><span>Contexto</span><input id="context" type="range" min="8" max="20" value="12" aria-label="Número de tokens de entrada"><output id="context-value">4K tokens</output></label>
      <label class="pace"><span class="sr-only">Velocidad de la animación</span><select id="pace" aria-label="Velocidad de la animación"><option value="0.4">0,4×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    </footer>
    <section id="story-panel" class="story-panel" aria-label="Historia guiada" hidden>
      <div id="story-models" class="story-models"><span data-story-model="0"><small>2017</small>Transformer original</span><span data-story-model="1"><small>2026</small>DeepSeek V4.1 Flash</span></div>
      <div class="story-copy" aria-live="polite" aria-atomic="true"><p id="story-kicker" class="story-kicker"></p><h2 id="story-title"></h2><p id="story-caption"></p></div>
      <div class="story-controls">
        <button id="story-previous" class="icon-button" aria-label="Capítulo anterior" title="Capítulo anterior"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <button id="story-play" class="icon-button" aria-label="Pausar la historia" title="Pausar la historia"></button>
        <button id="story-audio" class="icon-button" aria-label="Silenciar la narración" title="Silenciar la narración" aria-pressed="true"></button>
        <button id="story-next" class="icon-button" aria-label="Capítulo siguiente" title="Capítulo siguiente"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <button id="story-exit" class="icon-button" aria-label="Salir de la historia y explorar" title="Salir de la historia"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <nav id="story-chapters" class="story-chapters" aria-label="Capítulos de la historia"></nav>
      <output id="story-time" class="story-time" aria-label="Tiempo de reproducción de la historia">0:00 / 1:00</output>
    </section>
  </main>
  <dialog id="source-dialog"><div class="dialog-top"><h2>Fuentes y supuestos</h2><button id="close-sources" class="icon-button" aria-label="Cerrar las fuentes"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div id="source-content"></div></dialog>
  <script type="module" src="app.js?revision=11"></script>
</body>
</html>
